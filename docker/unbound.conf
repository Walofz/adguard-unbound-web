server:
    ###########################################################################
    # BASIC SETTINGS
    ###########################################################################
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    do-ip6: no
    prefer-ip6: no
    directory: "/etc/unbound"
    username: "unbound"
    chroot: ""
    extended-statistics: yes

    # Trust anchor (RFC 5011 auto-update) + root hints ที่ refresh ทุก 7 วัน
    # ไฟล์อยู่ใน /var/lib/unbound ซึ่ง persist ผ่าน named volume `unbound-data`
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    root-hints: "/var/lib/unbound/root.hints"

    # ขนาดแคช (ประหยัด RAM)
    msg-cache-size: 64M
    rrset-cache-size: 128M
    cache-max-ttl: 86400
    cache-min-ttl: 300

    ###########################################################################
    # SECURITY & PRIVACY
    ###########################################################################
    access-control: 127.0.0.1/32 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow
    access-control: 10.0.0.0/8 allow
    # ล็อกไม่ให้คนนอกถาม
    access-control: 0.0.0.0/0 refuse

    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-below-nxdomain: yes
    use-caps-for-id: yes
    val-clean-additional: yes
    qname-minimisation: yes
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16

    ###########################################################################
    # PERFORMANCE
    ###########################################################################
    num-threads: 2
    num-queries-per-thread: 1024
    outgoing-range: 4096
    so-reuseport: yes
    minimal-responses: yes
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    outbound-msg-retry: 2
    infra-cache-min-rtt: 30
    unknown-server-time-limit: 200

    ###########################################################################
    # LOGGING (ใช้โดยหน้า Query Log ของ webapp)
    ###########################################################################
    verbosity: 1
    use-syslog: no
    logfile: "/logs/unbound.log"
    log-replies: yes

forward-zone:
    name: "."
    forward-first: yes
    forward-addr: 1.1.1.1
    forward-addr: 1.0.0.1

remote-control:
    control-enable: yes
    # เข้าถึงได้เฉพาะใน docker network เท่านั้น (ไม่ publish port นี้)
    control-interface: 0.0.0.0
    control-port: 8953
    control-use-cert: no
