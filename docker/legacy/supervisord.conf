[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid

[program:unbound]
command=/usr/sbin/unbound -d -c /etc/unbound/unbound.conf
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:webapp]
command=/usr/local/bin/uvicorn main:app --host 0.0.0.0 --port 8080
directory=/app
user=unbound
environment=HOME="/tmp",PYTHONUNBUFFERED="1",CONFIG_FILE="/config/config.toml"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0