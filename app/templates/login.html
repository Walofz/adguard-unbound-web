<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unbound Admin — Sign in</title>
    <style>
        :root {
            --bg: #f2f4f7;
            --card: #ffffff;
            --text: #2f3439;
            --muted: #7b8794;
            --border: #e3e8ee;
            --accent: #67b279;
            --bad: #e05252;
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #14181d;
                --card: #1c2229;
                --text: #e6edf3;
                --muted: #8b98a5;
                --border: #2b333d;
                color-scheme: dark;
            }
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5em;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.2em 2em;
            box-shadow: 0 10px 30px rgba(16, 24, 40, .10)
        }

        .brand {
            display: flex;
            align-items: center;
            gap: .6em;
            margin-bottom: .3em
        }

        .brand svg {
            width: 30px;
            height: 30px;
            color: var(--accent)
        }

        .brand h1 {
            font-size: 1.15em;
            margin: 0;
            font-weight: 650
        }

        .sub {
            color: var(--muted);
            font-size: .9em;
            margin: .2em 0 1.4em
        }

        label {
            display: block;
            font-size: .8em;
            font-weight: 600;
            color: var(--muted);
            margin: .9em 0 .35em
        }

        input {
            width: 100%;
            padding: .7em .85em;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--bg);
            color: var(--text);
            font: inherit;
            outline: none;
            transition: border-color .15s, box-shadow .15s
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(103, 178, 121, .18)
        }

        button {
            width: 100%;
            padding: .8em;
            margin-top: 1.4em;
            border: 0;
            border-radius: 9px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-weight: 650;
            cursor: pointer;
            transition: filter .15s
        }

        button:hover {
            filter: brightness(.95)
        }

        .error {
            background: rgba(224, 82, 82, .10);
            border: 1px solid rgba(224, 82, 82, .35);
            color: var(--bad);
            border-radius: 9px;
            padding: .65em .85em;
            font-size: .88em;
            margin-bottom: .6em
        }

        .footer {
            color: var(--muted);
            font-size: .78em;
            text-align: center;
            margin-top: 1.4em
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"></path>
            </svg>
            <h1>Unbound Admin</h1>
        </div>
        <p class="sub">เข้าสู่ระบบเพื่อดูสถิติและสั่งงาน resolver</p>

        {% if error %}<div class="error">{{ error }}</div>{% endif %}

        <form method="post" action="/login">
            <label for="username">Username</label>
            <input id="username" name="username" placeholder="username" autocomplete="username" spellcheck="false"
                required autofocus>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="••••••••••••"
                autocomplete="current-password" required>
            <button type="submit">Log in</button>
        </form>

        <div class="footer">unbound-web</div>
    </main>
</body>

</html>
