<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unbound Admin — Sign in</title>
    <style>
        :root {
            --bg: #edf3ef;
            --bg-strong: #dfece4;
            --card: rgba(255,255,255,0.92);
            --card-strong: #f5faf7;
            --text: #172421;
            --muted: #5f726a;
            --border: #d8e4dc;
            --accent: #35b26d;
            --accent-strong: #24975f;
            --accent-soft: rgba(53, 178, 109, 0.12);
            --bad: #d95757;
            --shadow: 0 22px 50px rgba(23, 36, 33, 0.12);
            color-scheme: light;
        }

        [data-theme="dark"] {
            --bg: #0d1518;
            --bg-strong: #111d24;
            --card: rgba(17, 27, 31, 0.9);
            --card-strong: #16252d;
            --text: #e9f0f2;
            --muted: #9cb0b8;
            --border: #23353f;
            --accent: #78d7a2;
            --accent-strong: #60c892;
            --accent-soft: rgba(120, 215, 162, 0.14);
            --bad: #ff8d8d;
            --shadow: 0 24px 55px rgba(2, 6, 10, 0.45);
            color-scheme: dark;
        }

        * { box-sizing: border-box }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.8em;
            background:
                radial-gradient(circle at top left, rgba(53, 178, 109, 0.15), transparent 28%),
                linear-gradient(135deg, var(--bg) 0%, var(--bg-strong) 100%);
            color: var(--text);
            font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 2.2em 2em 1.8em;
            box-shadow: var(--shadow);
            backdrop-filter: blur(6px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: .75em;
            margin-bottom: .7em;
        }

        .brand svg {
            width: 34px;
            height: 34px;
            color: var(--accent);
            background: var(--accent-soft);
            border: 1px solid rgba(53, 178, 109, 0.2);
            border-radius: 12px;
            padding: 6px;
        }

        .brand h1 {
            font-size: 1.2em;
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .sub {
            color: var(--muted);
            font-size: .9em;
            margin: .25em 0 1.4em;
        }

        label {
            display: block;
            font-size: .78em;
            font-weight: 700;
            color: var(--muted);
            margin: 1em 0 .45em;
            letter-spacing: .02em;
        }

        input {
            width: 100%;
            padding: .8em .9em;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card-strong);
            color: var(--text);
            font: inherit;
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }

        button {
            width: 100%;
            padding: .9em 1em;
            margin-top: 1.4em;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
            color: #ffffff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
            box-shadow: 0 12px 22px rgba(53, 178, 109, 0.25);
        }

        button:hover {
            filter: brightness(1.02);
            transform: translateY(-1px);
        }

        .error {
            background: rgba(217, 87, 87, 0.08);
            border: 1px solid rgba(217, 87, 87, 0.24);
            color: var(--bad);
            border-radius: 12px;
            padding: .75em .85em;
            font-size: .88em;
            margin-bottom: .8em;
        }

        .footer {
            color: var(--muted);
            font-size: .76em;
            text-align: center;
            margin-top: 1.4em;
            letter-spacing: .06em;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"></path>
            </svg>
            <h1>Unbound Admin</h1>
        </div>
        <p class="sub">เข้าสู่ระบบเพื่อดูสถิติและสั่งงาน resolver</p>

        {% if error %}<div class="error">{{ error }}</div>{% endif %}

        <form method="post" action="/login">
            <label for="username">Username</label>
            <input id="username" name="username" placeholder="username" autocomplete="username" spellcheck="false"
                required autofocus>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="••••••••••••"
                autocomplete="current-password" required>
            <button type="submit">Log in</button>
        </form>

        <div class="footer">unbound-web</div>
    </main>
</body>

</html>
