<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unbound Admin — เปลี่ยนรหัสผ่าน</title>
    <style>
        :root {
            --bg: #f2f4f7;
            --card: #ffffff;
            --text: #2f3439;
            --muted: #7b8794;
            --border: #e3e8ee;
            --accent: #67b279;
            --warn: #f2a33c;
            --bad: #e05252;
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #14181d;
                --card: #1c2229;
                --text: #e6edf3;
                --muted: #8b98a5;
                --border: #2b333d;
                color-scheme: dark;
            }
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5em;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.2em 2em;
            box-shadow: 0 10px 30px rgba(16, 24, 40, .10)
        }

        h1 {
            font-size: 1.15em;
            margin: 0 0 .3em
        }

        .sub {
            color: var(--muted);
            font-size: .9em;
            margin: 0 0 1.2em
        }

        .notice {
            background: rgba(242, 163, 60, .12);
            border: 1px solid rgba(242, 163, 60, .4);
            color: #a86a12;
            border-radius: 9px;
            padding: .7em .9em;
            font-size: .88em;
            margin-bottom: 1em
        }

        @media (prefers-color-scheme: dark) {
            .notice {
                color: var(--warn)
            }
        }

        label {
            display: block;
            font-size: .8em;
            font-weight: 600;
            color: var(--muted);
            margin: .9em 0 .35em
        }

        input {
            width: 100%;
            padding: .7em .85em;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--bg);
            color: var(--text);
            font: inherit;
            outline: none;
            transition: border-color .15s, box-shadow .15s
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(103, 178, 121, .18)
        }

        button {
            width: 100%;
            padding: .8em;
            margin-top: 1.4em;
            border: 0;
            border-radius: 9px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-weight: 650;
            cursor: pointer
        }

        button:hover {
            filter: brightness(.95)
        }

        .error {
            background: rgba(224, 82, 82, .10);
            border: 1px solid rgba(224, 82, 82, .35);
            color: var(--bad);
            border-radius: 9px;
            padding: .65em .85em;
            font-size: .88em;
            margin-bottom: .6em
        }

        .footer {
            color: var(--muted);
            font-size: .8em;
            text-align: center;
            margin-top: 1.2em
        }

        .footer a {
            color: var(--accent);
            text-decoration: none
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>เปลี่ยนรหัสผ่าน</h1>
        <p class="sub">ผู้ใช้: {{ user }}</p>

        {% if forced %}
        <div class="notice">⚠️ คุณกำลังใช้รหัสเริ่มต้น — ต้องเปลี่ยนรหัสก่อนใช้งานครั้งแรก</div>
        {% endif %}
        {% if error %}<div class="error">{{ error }}</div>{% endif %}

        <form method="post" action="/change-password">
            <label for="current">รหัสผ่านปัจจุบัน</label>
            <input id="current" name="current" type="password" autocomplete="current-password" required autofocus>

            <label for="new">รหัสผ่านใหม่ (อย่างน้อย 12 ตัวอักษร)</label>
            <input id="new" name="new" type="password" autocomplete="new-password" minlength="12" required>

            <label for="confirm">ยืนยันรหัสผ่านใหม่</label>
            <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="12" required>

            <button type="submit">บันทึกรหัสใหม่</button>
        </form>

        <div class="footer"><a href="/logout">ออกจากระบบ</a></div>
    </main>
</body>

</html>
