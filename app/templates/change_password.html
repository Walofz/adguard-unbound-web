<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unbound Admin — เปลี่ยนรหัสผ่าน</title>
    <style>
        :root {
            --bg: #edf3ef;
            --bg-strong: #dfece4;
            --card: rgba(255,255,255,0.92);
            --card-strong: #f5faf7;
            --text: #172421;
            --muted: #5f726a;
            --border: #d8e4dc;
            --accent: #35b26d;
            --accent-strong: #24975f;
            --accent-soft: rgba(53, 178, 109, 0.12);
            --warn: #d39a2f;
            --bad: #d95757;
            --shadow: 0 22px 50px rgba(23, 36, 33, 0.12);
            color-scheme: light;
        }

        [data-theme="dark"] {
            --bg: #0d1518;
            --bg-strong: #111d24;
            --card: rgba(17, 27, 31, 0.9);
            --card-strong: #16252d;
            --text: #e9f0f2;
            --muted: #9cb0b8;
            --border: #23353f;
            --accent: #78d7a2;
            --accent-strong: #60c892;
            --accent-soft: rgba(120, 215, 162, 0.14);
            --warn: #f3bc5d;
            --bad: #ff8d8d;
            --shadow: 0 24px 55px rgba(2, 6, 10, 0.45);
            color-scheme: dark;
        }

        * { box-sizing: border-box }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.8em;
            background:
                radial-gradient(circle at top left, rgba(53, 178, 109, 0.15), transparent 28%),
                linear-gradient(135deg, var(--bg) 0%, var(--bg-strong) 100%);
            color: var(--text);
            font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 2.1em 2em 1.6em;
            box-shadow: var(--shadow);
            backdrop-filter: blur(6px);
        }

        h1 {
            font-size: 1.25em;
            margin: 0 0 .3em;
            letter-spacing: -0.02em;
        }

        .sub {
            color: var(--muted);
            font-size: .9em;
            margin: 0 0 1.2em;
        }

        .notice {
            background: rgba(211, 154, 47, 0.11);
            border: 1px solid rgba(211, 154, 47, 0.32);
            color: var(--warn);
            border-radius: 12px;
            padding: .8em .9em;
            font-size: .88em;
            margin-bottom: 1em;
        }

        label {
            display: block;
            font-size: .78em;
            font-weight: 700;
            color: var(--muted);
            margin: 1em 0 .45em;
            letter-spacing: .02em;
        }

        input {
            width: 100%;
            padding: .8em .9em;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card-strong);
            color: var(--text);
            font: inherit;
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }

        button {
            width: 100%;
            padding: .9em 1em;
            margin-top: 1.5em;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
            color: #ffffff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
            box-shadow: 0 12px 22px rgba(53, 178, 109, 0.25);
        }

        button:hover {
            filter: brightness(1.02);
            transform: translateY(-1px);
        }

        .error {
            background: rgba(217, 87, 87, 0.08);
            border: 1px solid rgba(217, 87, 87, 0.24);
            color: var(--bad);
            border-radius: 12px;
            padding: .75em .85em;
            font-size: .88em;
            margin-bottom: .8em;
        }

        .footer {
            color: var(--muted);
            font-size: .8em;
            text-align: center;
            margin-top: 1.2em;
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>เปลี่ยนรหัสผ่าน</h1>
        <p class="sub">ผู้ใช้: {{ user }}</p>

        {% if forced %}
        <div class="notice">⚠️ คุณกำลังใช้รหัสเริ่มต้น — ต้องเปลี่ยนรหัสก่อนใช้งานครั้งแรก</div>
        {% endif %}
        {% if error %}<div class="error">{{ error }}</div>{% endif %}

        <form method="post" action="/change-password">
            <label for="current">รหัสผ่านปัจจุบัน</label>
            <input id="current" name="current" type="password" autocomplete="current-password" required autofocus>

            <label for="new">รหัสผ่านใหม่ (อย่างน้อย 12 ตัวอักษร)</label>
            <input id="new" name="new" type="password" autocomplete="new-password" minlength="12" required>

            <label for="confirm">ยืนยันรหัสผ่านใหม่</label>
            <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="12" required>

            <button type="submit">บันทึกรหัสใหม่</button>
        </form>

        <div class="footer"><a href="/logout">ออกจากระบบ</a></div>
    </main>
</body>

</html>
